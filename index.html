<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Catch Up</title>
<meta name="description" content="Οι σειρές που βλέπεις και πού έμεινες.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catch Up">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
/* Catch Up — black page, grey liquid-glass chrome (same tokens as Proza / Pocket Byte gallery).
   One sticky glass search bar on top, poster shelf below, a glass sheet per show. */
:root{
  --bg:#000;--ink:#f5f5f7;--muted:#8e8e93;--dim:#5e5e63;
  --glass:rgba(40,40,44,.58);--glass-strong:rgba(26,26,30,.78);--glass-soft:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.14);--line:rgba(255,255,255,.10);
  --hi:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.28);
  --blur:saturate(180%) blur(22px);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.card,.card *,img{-webkit-touch-callout:none;-webkit-user-drag:none}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--stroke);box-shadow:var(--hi),0 6px 18px rgba(0,0,0,.35)}

/* ---- search bar ---- */
.top{position:sticky;top:0;z-index:5;padding:calc(var(--st) + 12px) 16px 14px}
.top::before{content:"";position:absolute;inset:0 0 -18px;background:linear-gradient(#000 calc(var(--st) + 8px),rgba(0,0,0,.72) 62%,rgba(0,0,0,0));pointer-events:none;z-index:-1}
.search{max-width:720px;margin:0 auto;height:48px;border-radius:16px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.search svg{width:18px;height:18px;flex:none;color:rgba(255,255,255,.62)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:500 17px var(--ui);outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:rgba(255,255,255,.45)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{box-shadow:var(--hi),inset 0 0 0 1px rgba(255,255,255,.22),0 10px 26px rgba(0,0,0,.4)}
.x{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;padding:0;flex:none}
.x svg{width:12px;height:12px;color:#d1d1d6}

/* ---- shelf ---- */
.shelf{max-width:720px;margin:0 auto;padding:6px 16px calc(var(--sb) + 48px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
@media (min-width:560px){.shelf{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 16px}}
.card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-self:start;width:100%;min-width:0}
.card .poster{width:100%;flex:none}
.card .l1,.card .l2{height:1.3em;line-height:1.3em}
/* a new episode is out past where you stopped: the poster glows */
.card.fresh .poster{box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 16px 3px rgba(255,255,255,.38),0 0 42px 6px rgba(255,255,255,.16),0 12px 26px rgba(0,0,0,.55);animation:halo 2.6s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 0 24px 6px rgba(255,255,255,.5),0 0 60px 12px rgba(255,255,255,.2),0 12px 26px rgba(0,0,0,.55)}}
@media (prefers-reduced-motion:reduce){.card.fresh .poster{animation:none}}
.card.fresh .l2{color:var(--ink);font-weight:600}
/* you watched the whole thing and the show has ended: poster goes black and white */
.card.gone .poster img,.hd.gone .poster img{filter:grayscale(1) contrast(1.05) brightness(.85)}
.card.gone .l1{color:var(--muted)}
.shelf.enter .card{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card:active .poster{transform:scale(.97)}
.poster{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#1c1c1e;box-shadow:0 0 0 .5px var(--stroke),0 12px 26px rgba(0,0,0,.55);transition:transform .2s ease}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.poster::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(170deg,rgba(255,255,255,.16),rgba(255,255,255,0) 32%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);pointer-events:none}
.poster .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font-weight:700;font-size:14px;line-height:1.15;color:#d1d1d6;background:linear-gradient(160deg,#2c2c30,#141416)}
.bar{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:3px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);overflow:hidden;z-index:1}
.bar i{display:block;height:100%;background:#fff;border-radius:3px}
.l1{margin-top:9px;font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{margin-top:2px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2.soon{color:#d1d1d6}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:15px;line-height:1.5;padding:22vh 24px 0}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}

/* ---- search results ---- */
.results{max-width:720px;margin:0 auto;padding:4px 16px calc(var(--sb) + 40px);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:18px;width:100%;text-align:left}
.row .th{width:46px;height:68px;border-radius:9px;overflow:hidden;flex:none;background:#1c1c1e;box-shadow:0 0 0 .5px var(--stroke);position:relative}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .tx{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:#f5f5f7;color:#000;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.add.on{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:var(--hi)}
.add svg{width:15px;height:15px}
.note{color:var(--muted);text-align:center;font-size:14px;padding:30px 10px}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s ease}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;max-height:calc(100% - var(--st) - 24px);overflow:hidden;display:flex;flex-direction:column;border-radius:30px 30px 0 0;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--stroke);border-bottom:0;box-shadow:var(--hi),0 -24px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .art{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(46px) grayscale(1) brightness(.55);opacity:.55;z-index:-1;pointer-events:none}
.grab{flex:none;padding:10px 0 4px;display:grid;place-items:center;touch-action:none}
.grab i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.28)}
.sx{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0;z-index:2}
.sx svg{width:12px;height:12px}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px calc(var(--sb) + 22px);overscroll-behavior:contain}
.hd{display:flex;gap:14px;align-items:flex-end;padding-right:36px}
.hd .poster{width:92px;flex:none;border-radius:12px}
.hd h2{margin:0;font-size:22px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.hd .meta{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.4}
.box{margin-top:14px;border-radius:20px;padding:14px 16px;background:var(--glass-soft);border:.5px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 2px}
.cam{height:34px;padding:0 13px 0 11px;border-radius:999px;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;background:var(--glass);border:.5px solid var(--stroke);box-shadow:var(--hi),0 4px 12px rgba(0,0,0,.3)}
.cam svg{width:17px;height:17px}
.cam:active{transform:scale(.95)}
.scan{margin:10px 0 2px;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.07);border:.5px solid var(--line);font-size:14px;line-height:1.4}
.scan b{font-size:17px;display:block;margin-top:2px}
.scan .acts{display:flex;gap:8px;margin-top:10px}
.scan .acts button{flex:1;height:38px;border-radius:999px;border:0;font-size:14.5px;font-weight:600;background:rgba(255,255,255,.1);box-shadow:var(--hi)}
.scan .acts button.ok{background:#f5f5f7;color:#000}
.scan .muted{color:var(--muted);font-size:13px}
.v{font-size:17px;font-weight:600;margin-top:5px;line-height:1.3}
.v small{display:block;font-size:13.5px;font-weight:500;color:var(--muted);margin-top:3px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.line+.line{border-top:.5px solid var(--line)}
.line .lab{font-size:15px;font-weight:500}
.line .lab small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{display:flex;align-items:center;gap:6px}
.sb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:22px;font-weight:400;line-height:1;background:var(--glass);border:.5px solid var(--stroke);box-shadow:var(--hi),0 4px 12px rgba(0,0,0,.3)}
.sb:active{transform:scale(.92)}
.sb:disabled{opacity:.3;pointer-events:none}
.done:disabled{background:rgba(255,255,255,.1);color:var(--muted);box-shadow:var(--hi)}
.num{width:58px;height:40px;border:0;background:none;color:var(--ink);text-align:center;font:600 26px var(--ui);font-variant-numeric:tabular-nums;outline:none;padding:0;border-radius:10px}
.num:focus{background:rgba(255,255,255,.08)}
.time{display:flex;align-items:center;gap:2px}
.time .num{width:46px;font-size:24px}
.time .num.hh{width:34px}
.time span{font-size:20px!important}
.time .num.ss{color:#d1d1d6}
.save{margin-top:14px;width:100%;height:50px;border:0;border-radius:999px;background:#f5f5f7;color:#000;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.save:active{transform:scale(.98)}
.done.sec{margin-top:10px;background:var(--glass);color:var(--ink);border:.5px solid var(--stroke);box-shadow:var(--hi)}
.time span{font-size:22px;font-weight:600;color:var(--muted)}
.unit{font-size:12px;color:var(--muted);text-align:right;margin-top:-2px}
.done{margin-top:14px;width:100%;height:50px;border:0;border-radius:999px;background:#f5f5f7;color:#000;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.done:active{transform:scale(.98)}
.saved{text-align:center;font-size:12.5px;color:var(--muted);height:18px;margin-top:10px;opacity:0;transition:opacity .25s}
.saved.on{opacity:1}
.hd .poster{cursor:pointer}
.pen{position:absolute;right:6px;bottom:6px;z-index:2;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}
.pen svg{width:12px;height:12px;color:#fff}
.nm{display:block;width:100%;margin:0;padding:2px 0;border:0;border-bottom:.5px dashed var(--stroke);background:none;color:var(--ink);font:700 22px/1.15 var(--ui);letter-spacing:-.02em;outline:none;border-radius:0;resize:none;overflow:hidden}
.nm:focus{border-bottom-color:rgba(255,255,255,.4)}
.row.manual .th{display:grid;place-items:center;color:var(--muted);font-size:22px;font-weight:300}
.rm{display:block;margin:6px auto 0;border:0;background:none;color:var(--dim);font-size:14px;padding:10px 14px}
.rm.arm{color:#ff6961}
.card.held .poster{transform:scale(.95);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 12px 26px rgba(0,0,0,.55)}
.menu{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 16px);z-index:21;margin:0 auto;max-width:420px;border-radius:24px;padding:8px;background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--stroke);box-shadow:var(--hi),0 20px 50px rgba(0,0,0,.6);transform:translateY(20px);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.menu.on{transform:none;opacity:1}
.menu .mt{display:flex;align-items:center;gap:12px;padding:8px 8px 12px}
.menu .mt .poster{width:40px;border-radius:7px;flex:none}
.menu .ph{font-size:0}
.menu .mt b{font-size:16px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.menu button{display:block;width:100%;height:50px;border:0;border-radius:16px;font-size:16px;font-weight:600;background:rgba(255,255,255,.08);margin-top:6px}
.menu .del{color:#ff6961}
.glink{display:inline-block;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--glass);border:.5px solid var(--stroke);box-shadow:var(--hi)}
</style>
</head>
<body>
<header class="top">
  <label class="search glass">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="q" type="search" placeholder="Αναζήτηση σειράς" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Αναζήτηση σειράς">
    <button class="x" id="qx" type="button" aria-label="Καθαρισμός" hidden><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  </label>
</header>

<main class="shelf" id="shelf"></main>
<section class="results" id="results" hidden></section>

<input type="file" id="pf" accept="image/*" hidden>
<input type="file" id="cf" accept="image/*" capture="environment" hidden>
<div class="scrim" id="scrim" hidden></div>
<div class="menu" id="menu" role="dialog" aria-modal="true" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="art" id="art"></div>
  <div class="grab" id="grab"><i></i></div>
  <button class="sx glass" id="sx" type="button" aria-label="Κλείσιμο"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  <div class="sbody" id="sbody"></div>
</div>

<script>
'use strict';
const API = 'https://api.tvmaze.com';
const KEY = 'catchup-v1';
const STALE = 3 * 3600e3;            // refresh show info after 3 hours
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- storage ---------- */
let db = { shows: {} };
try { const raw = localStorage.getItem(KEY); if (raw) db = JSON.parse(raw); } catch (e) {}
if (!db || typeof db !== 'object' || !db.shows) db = { shows: {} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------- dates (Greek) ---------- */
const DAY = 864e5;
const tf = new Intl.DateTimeFormat('el-GR', { hour: '2-digit', minute: '2-digit', hour12: false });
const wdS = new Intl.DateTimeFormat('el-GR', { weekday: 'short' });
const wdL = new Intl.DateTimeFormat('el-GR', { weekday: 'long' });
const dm = new Intl.DateTimeFormat('el-GR', { day: 'numeric', month: 'short' });
const dmy = new Intl.DateTimeFormat('el-GR', { day: 'numeric', month: 'short', year: 'numeric' });
const dmyL = new Intl.DateTimeFormat('el-GR', { day: 'numeric', month: 'long', year: 'numeric' });
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const clean = s => s.replace(/\./g, '');
const midnight = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const dayDiff = d => Math.round((midnight(d) - midnight(new Date())) / DAY);
const parseAir = ep => {
  if (!ep) return null;
  if (ep.airstamp) return { d: new Date(ep.airstamp), timed: true };
  if (ep.airdate) return { d: new Date(ep.airdate + 'T12:00:00'), timed: false };
  return null;
};
function whenShort(a) {
  const n = dayDiff(a.d), t = a.timed ? ' ' + tf.format(a.d) : '';
  if (n === 0) return 'Σήμερα' + t;
  if (n === 1) return 'Αύριο' + t;
  if (n > 1 && n < 7) return cap(clean(wdS.format(a.d))) + t;
  return clean(a.d.getFullYear() === new Date().getFullYear() ? dm.format(a.d) : dmy.format(a.d));
}
function whenLong(a) {
  const n = dayDiff(a.d), t = a.timed ? ', ' + tf.format(a.d) : '';
  if (n === 0) return 'Σήμερα' + t;
  if (n === 1) return 'Αύριο' + t;
  const base = cap(wdL.format(a.d)) + ' ' + clean(a.d.getFullYear() === new Date().getFullYear() ? dm.format(a.d) : dmy.format(a.d));
  return base + t;
}
const fmtTime = sec => {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
};

/* ---------- show helpers ---------- */
const multi = sh => (sh.seasons && sh.seasons.length > 1) || (sh.p && sh.p.s > 1);
const epLabel = (sh, s, e) => multi(sh) ? `S${s} E${e}` : `E${e}`;
const year = sh => sh.premiered ? sh.premiered.slice(0, 4) : '';
const netName = sh => sh.network || '';
/* episode numbers read from the channels' own sites (data/greek.json, refreshed by a GitHub Action) */
let CH = {};
function chFor(sh) {
  const want = foldT(sh.name);
  return Object.values(CH).find(r => r.latest && ((r.tvmaze && r.tvmaze === sh.id) || (r.names || []).some(n => foldT(n) === want))) || null;
}
async function loadChannels() {
  try {
    const j = await fetch('data/greek.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
    CH = j.shows || {}; render();
    if (openId != null && !(sbody.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) { const y = sbody.scrollTop; renderSheet(); sbody.scrollTop = y; }
  } catch (e) {}
}
function nextSlot(sc) {
  if (!sc || !sc.days || !sc.time) return null;
  const [h, m] = sc.time.split(':').map(Number), now = new Date();
  for (let i = 0; i < 8; i++) { const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(h, m, 0, 0); if (sc.days.includes(d.getDay()) && d > now) return d; }
  return null;
}
const maxAired = (sh, s) => {
  const tv = sh.aired && sh.aired.by ? sh.aired.by[s] || 0 : 0;
  const ch = chFor(sh);

      <div class="line"><div class="lab">Χρόνος<small>ώρα : λεπ : δευτ</small></div><div class="time">

        <span>:</span>

        <span>:</span>

    </div>
    <button class="save" type="button" data-a="save">Αποθήκευση</button>
    ${L && s >= L.S && L.E(s) && e >= L.E(s) ? (sh.status === 'Ended'

      : `<button class="done sec" type="button" disabled>Είσαι στο τελευταίο επεισόδιο</button>`) : `<button class="done sec" type="button" data-a="fin">${e > 0 ? 'Το τελείωσα · πάμε στο επόμενο' : 'Ξεκινώ από το 1ο επεισόδιο'}</button>`}
    <div class="saved" id="saved">Αποθηκεύτηκε</div>
    <button class="rm" type="button" data-a="rm">Αφαίρεση από τη βιβλιοθήκη</button>`;
}
function flashSaved() {

  el.classList.add('on'); clearTimeout(savedT); savedT = setTimeout(() => el.classList.remove('on'), 1100);
}
function commit(rerender) {
  const sh = db.shows[openId]; if (!sh) return;
  sh.p.at = Date.now(); save(); flashSaved();
  if (rerender) { const y = sbody.scrollTop; renderSheet(); sbody.scrollTop = y; flashSaved(); }
}
let rmArm = 0;
sbody.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;

  const p = sh.p, a = b.dataset.a;

  else if (a === 'fin') {
    if (!p.s) p.s = 1;
    const mx = maxAired(sh, p.s);
    const nextS = (sh.seasons || []).some(x => x.n === p.s + 1) && maxAired(sh, p.s + 1) > 0;
    const L = limits(sh);
    if (p.e > 0 && mx && p.e >= mx && nextS) { p.s++; p.e = 1; }
    else if (L && mx && p.e >= mx) return;

  }

  else if (a === 'save') { clearTimeout(inT); commit(false); closeSheet(); return; }
  else if (a === 'scan-ok') { const r = scanResult; if (!r) return; if (r.s) p.s = r.s; if (r.e) p.e = r.e; if (r.t != null) p.t = r.t; scanResult = null; clampP(sh); }
  else if (a === 'scan-no') { scanResult = null; $('scan').innerHTML = ''; return; }
  else if (a === 'rm') {
    if (Date.now() - rmArm < 3000) { delete db.shows[openId]; save(); closeSheet(); return; }
    rmArm = Date.now(); b.classList.add('arm'); b.textContent = 'Πάτα ξανά για αφαίρεση';
    setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.textContent = 'Αφαίρεση από τη βιβλιοθήκη'; } }, 3000);

sbody.addEventListener('keydown', ev => { if (ev.target.id === 'vn' && ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); } });
sbody.addEventListener('change', ev => {
  if (ev.target.id !== 'vn') return;
  const sh = db.shows[openId]; if (!sh) return;
  sh.name = ev.target.value.trim() || sh.name; ev.target.value = sh.name; save(); flashSaved();
});
function loadPoster(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const W = 300, H = 450, c = document.createElement('canvas'); c.width = W; c.height = H;
      const g = c.getContext('2d'), k = Math.max(W / im.width, H / im.height), w = im.width * k, h = im.height * k;
      g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(); };
    im.src = u;
  });
}
/* ---------- poster for shows added by hand: Wikipedia, only on an exact title match ---------- */
const foldT = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\(.*?\)/g, '').replace(/^(οι|η|ο|το|τα|the)\s+/, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
async function findPoster(id) {
  const sh = db.shows[id]; if (!sh || sh.img || sh.cimg) return;
  sh.posterTried = Date.now(); save();
  const want = foldT(sh.name);
  for (const host of ['el.wikipedia.org', 'en.wikipedia.org']) {
    for (const extra of [' τηλεοπτική σειρά', '']) {
      try {
        const u = `https://${host}/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(sh.name + extra)}&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*`;
        const j = await fetch(u).then(r => r.json());
        const hit = Object.values((j.query || {}).pages || {}).sort((a, b) => a.index - b.index).find(p => p.thumbnail && foldT(p.title) === want);
        if (hit) {
          const cur = db.shows[id]; if (!cur || cur.img || cur.cimg) return;
          cur.img = hit.thumbnail.source; save(); render();
          if (openId === id) { const y = sbody.scrollTop; renderSheet(); sbody.scrollTop = y; }
          return;
        }
      } catch (e) {}
    }
  }
  if (openId === id) { const y = sbody.scrollTop; renderSheet(); sbody.scrollTop = y; }
}
/* ---------- read the TV photo (on the phone, with Tesseract) ---------- */
let scanResult = null, ocrWorker = null;
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
async function getOCR() {
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  ocrWorker = await Tesseract.createWorker('eng', 1);
  await ocrWorker.setParameters({ tessedit_pageseg_mode: '11' });
  return ocrWorker;
}
function prepImage(file, invert) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1800 / Math.max(im.width, im.height)), W = Math.round(im.width * k), H = Math.round(im.height * k);
      const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
      g.drawImage(im, 0, 0, W, H); URL.revokeObjectURL(u);
      const d = g.getImageData(0, 0, W, H), a = d.data; let lo = 255, hi = 0;
      for (let i = 0; i < a.length; i += 4) { const v = a[i] * .3 + a[i + 1] * .59 + a[i + 2] * .11; a[i] = v; if (v < lo) lo = v; if (v > hi) hi = v; }
      const sc = 255 / Math.max(1, hi - lo);
      for (let i = 0; i < a.length; i += 4) { let v = (a[i] - lo) * sc; if (invert) v = 255 - v; a[i] = a[i + 1] = a[i + 2] = v; }
      g.putImageData(d, 0, 0); res(c);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(); };
    im.src = u;
  });
}
function parseTV(raw) {
  const txt = raw.replace(/(?<=\d)[oO](?=\d)|(?<=\d)[oO]\b/g, '0').replace(/(?<=\d)[lI|](?=\d)/g, '1').replace(/[;∶]/g, ':').replace(/\s*:\s*/g, ':');
  const out = {};
  // "S2:E5", "S1E5", "Season 1, Part 25", "Season 1 Episode 25", "Σεζόν 1 Επεισόδιο 25"
  const se = txt.match(/\bS(?:eason)?\s*(\d{1,2})\s*[:.\-|,]?\s*(?:E|Ep|Episode|Part|Pt)\.?\s*(\d{1,4})\b/i) || txt.match(/Σεζ[οό]ν\s*(\d{1,2})\D{0,8}?(?:Επεισ[οό]διο|Επ\.?|Μέρος)\s*(\d{1,4})/i);
  if (se) { out.s = +se[1]; out.e = +se[2]; }
  else { const ep = txt.match(/\b(?:episode|ep\.?|part|pt\.?|e)\s*(\d{1,4})\b/i) || txt.match(/(?:Επεισ[οό]διο|Μέρος)\s*(\d{1,4})/i); if (ep) out.e = +ep[1]; }
  const times = [];
  const re = /(-)?\b(\d{1,2}):([0-5]\d)(?::([0-5]\d))?\b/g; let m;
  while ((m = re.exec(txt))) {
    if (m[1]) continue;                                   // "-28:30" is time remaining
    if (/^\s*(?:AM|PM|ΠΜ|ΜΜ)\b/i.test(txt.slice(re.lastIndex, re.lastIndex + 4))) continue;   // a clock, e.g. "8:04 PM\"
    const sec = m[4] != null ? (+m[2]) * 3600 + (+m[3]) * 60 + (+m[4]) : (+m[2]) * 60 + (+m[3]);
    if (sec < 4 * 3600) times.push({ sec, at: m.index, end: re.lastIndex });
  }
  if (times.length) {
    let pick = times[0];
    for (let i = 0; i + 1 < times.length; i++) if (/^\s*\/\s*$/.test(txt.slice(times[i].end, times[i + 1].at))) { pick = times[i]; break; }

  }

}
function showScan(html) { const el = $('scan'); if (el) el.innerHTML = html ? `<div class="scan">${html}</div>` : ''; }
$('cf').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  const sh = db.shows[openId]; if (!f || !sh) return;

    const w = await getOCR();
    let r = parseTV((await w.recognize(await prepImage(f, false))).data.text);
    if (r.t == null || r.e == null) {

      r = Object.assign({}, r2, r);

    scanResult = r;
    const ep = r.e ? (r.s ? `S${r.s} E${r.e}` : `Επεισόδιο ${r.e}`) : 'Επεισόδιο: δεν φαίνεται';
    const tm = r.t != null ? fmtTime(r.t) : 'λεπτό: δεν φαίνεται';
    showScan(`Βρήκα στη φωτογραφία<b>${esc(ep)} · ${esc(tm)}</b><div class="acts"><button type="button" data-a="scan-no">Άκυρο</button><button type="button" class="ok" data-a="scan-ok">Βάλ' το</button></div>`);
  } catch (e) {
    showScan('Δεν μπόρεσα να διαβάσω τη φωτογραφία.<div class="muted">Χρειάζεται ίντερνετ την πρώτη φορά.</div><div class="acts"><button type="button" data-a="scan-no">Εντάξει</button></div>');
  }
});
$('pf').addEventListener('change', async ev => {

const int = v => { const n = parseInt(String(v).replace(/\D/g, ''), 10); return isNaN(n) ? 0 : n; };
let inT = 0;
sbody.addEventListener('input', ev => {

/* swipe the sheet down to close */
(() => {
  let y0 = null, dy = 0;
